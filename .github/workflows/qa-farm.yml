# QA farm: heavy Playwright/SwiftShader QA runs on GitHub runners instead of the 2-core session box.
# Push a branch named qa-job/<name> containing ci/jobs.txt (one shell command per line, run from game/).
# Each line becomes a parallel job. $BASE = main's game/ folder (QA_ROOT=$BASE for "old").
# Each job's game/qa/out is pushed to branch qa-out/<name>/<line#>. Never deploys; Pages is untouched.
name: qa-farm
on:
  push:
    branches: ['qa-job/**']
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.p.outputs.lines }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          L=[l.strip() for l in open('ci/jobs.txt') if l.strip() and not l.startswith('#')]
          print('lines='+json.dumps([{'i':i+1,'cmd':c} for i,c in enumerate(L)]))
          PY
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.lines) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: _base }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: playwright
        run: |
          mkdir -p ~/pw && cd ~/pw && npm init -y >/dev/null && npm i playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "PW_PATH=$HOME/pw/node_modules/playwright/index.js" >> $GITHUB_ENV
          echo "CHROMIUM_PATH=$(node -e "console.log(require('$HOME/pw/node_modules/playwright').chromium.executablePath())")" >> $GITHUB_ENV
          echo "BASE=$GITHUB_WORKSPACE/_base/game" >> $GITHUB_ENV
      - name: run
        working-directory: game
        env: { CMD: '${{ matrix.job.cmd }}' }
        run: |
          mkdir -p qa/out; date -u; nproc
          set +e; bash -c "$CMD" 2>&1 | tee qa/out/_ci_log.txt; rc=${PIPESTATUS[0]}; set -e
          echo "rc=$rc" >> qa/out/_ci_log.txt; echo "$CMD" > qa/out/_ci_cmd.txt; date -u
      - name: push results
        if: always()
        run: |
          B="qa-out/${GITHUB_REF_NAME#qa-job/}/${{ matrix.job.i }}"
          cd game/qa/out && git init -q && git checkout -q -b "$B"
          git -c user.name=qa-farm -c user.email=qa-farm@users.noreply.github.com add -A
          git -c user.name=qa-farm -c user.email=qa-farm@users.noreply.github.com commit -qm "qa-out ${{ matrix.job.i }}: ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
