<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Lala Luna Land — Green / 4 Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:      #F2764B;
    --dusk:     #3B2455;
    --meadow:   #4FA37A;
    --bone:     #F6EFE2;
    --ink:      #17111F;
    --moon:     #FFF3C4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink);}
  body{
    font-family:"DM Mono",ui-monospace,monospace;
    color:var(--bone);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  canvas{display:block;position:fixed;inset:0;}

  /* paper grain + vignette — the thing that sells hand-drawn */
  #grain{
    position:fixed;inset:-50%;pointer-events:none;z-index:5;
    opacity:.16;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation:jitter .5s steps(1) infinite;
  }
  @keyframes jitter{
    0%{transform:translate(0,0)} 25%{transform:translate(-2%,1%)}
    50%{transform:translate(1%,-2%)} 75%{transform:translate(2%,2%)}
  }
  #vig{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(23,17,31,.55) 100%);
  }
  @media (prefers-reduced-motion:reduce){ #grain{animation:none} }

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:6;pointer-events:none;padding:18px 20px;
       display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .stat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
  .val{font-size:26px;line-height:1;font-weight:500;letter-spacing:-.02em}
  .right{text-align:right}
  #letters{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
  .glyph{
    width:26px;height:30px;display:grid;place-items:center;
    font-family:"Instrument Serif",serif;font-size:19px;font-style:italic;
    border:1px solid rgba(246,239,226,.22);border-radius:3px;
    color:rgba(246,239,226,.2);transition:.45s;
  }
  .glyph.on{color:var(--ink);background:var(--moon);border-color:var(--moon);
            box-shadow:0 0 22px rgba(255,243,196,.5)}

  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;z-index:8;display:grid;place-items:center;
          background:rgba(23,17,31,.82);backdrop-filter:blur(7px);padding:28px;text-align:center}
  .screen.hide{display:none}
  .eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;opacity:.5;margin-bottom:14px}
  h1{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;
     font-size:clamp(44px,11vw,78px);line-height:.92;letter-spacing:-.02em;color:var(--moon)}
  h1 small{display:block;font-style:normal;font-size:.34em;letter-spacing:.12em;
           color:var(--bone);opacity:.7;margin-top:14px;text-transform:uppercase}
  p.hint{max-width:340px;margin:22px auto 0;font-size:12.5px;line-height:1.75;opacity:.62}
  button{
    pointer-events:auto;margin-top:30px;font-family:"DM Mono",monospace;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    padding:15px 34px;border-radius:999px;border:0;cursor:pointer;
    background:var(--moon);color:var(--ink);transition:transform .18s;
  }
  button:hover{transform:translateY(-2px)}
  button:focus-visible{outline:2px solid var(--sun);outline-offset:4px}
  .score-big{font-family:"Instrument Serif",serif;font-size:64px;color:var(--moon);line-height:1}
  .found{font-size:12px;letter-spacing:.1em;margin-top:16px;color:var(--sun)}
</style>
</head>
<body>

<div id="vig"></div><div id="grain"></div>

<div id="hud">
  <div class="row">
    <div><div class="stat">Distance</div><div class="val" id="dist">0</div></div>
    <div class="right">
      <div class="stat">Moons</div><div class="val" id="moons">0</div>
      <div id="letters">
        <div class="glyph" data-i="0">L</div><div class="glyph" data-i="1">U</div>
        <div class="glyph" data-i="2">N</div><div class="glyph" data-i="3">A</div>
      </div>
    </div>
  </div>
  <div class="row"><div class="stat" id="weather">Golden hour</div></div>
</div>

<div class="screen" id="start">
  <div>
    <div class="eyebrow">Island I — Green</div>
    <h1>Lala Luna<br>Land<small>4 Letters</small></h1>
    <p class="hint">Swipe or arrow keys to change lane. Tap or space to jump the ruins.
       Gather moons. Somewhere out past the rain, one letter is hiding.</p>
    <button id="play">Ride out</button>
  </div>
</div>

<div class="screen hide" id="over">
  <div>
    <div class="eyebrow">The wolf caught up</div>
    <div class="score-big" id="finalDist">0</div>
    <p class="hint" id="finalLine">metres of island</p>
    <div class="found" id="foundLine"></div>
    <button id="again">Run it back</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";

/* ============================================================
   PALETTE
   ============================================================ */
const C = {
  sun:0xF2764B, dusk:0x3B2455, sky:0x8FD3D8, meadow:0x4FA37A,
  meadowDark:0x2F7458, bone:0xF6EFE2, stone:0xE4D6BE, ink:0x17111F,
  moon:0xFFF3C4, dress:0x59C08A, boot:0x7A4A2B, horse:0x8A6247,
};

/* ============================================================
   RENDERER / SCENE
   ============================================================ */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.sun, 40, 130);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 4.4, 8.5);
camera.lookAt(0, 1.6, -8);

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   CEL SHADING — 3-step ramp, no PBR anywhere
   ============================================================ */
function ramp(steps){
  const data = new Uint8Array(steps);
  for(let i=0;i<steps;i++) data[i] = Math.round(70 + (185/(steps-1))*i);
  const t = new THREE.DataTexture(data, steps, 1, THREE.LuminanceFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
const GRAD = ramp(3);
const toon = (color) => new THREE.MeshToonMaterial({color, gradientMap:GRAD});

/* Inverted-hull outlines. This is what reads as "hand drawn" more
   than the shading does — expand along the normal in view space and
   render backfaces in ink. */
const outlineMat = new THREE.ShaderMaterial({
  uniforms:{ thickness:{value:2.4}, inkColor:{value:new THREE.Color(C.ink)} },
  vertexShader:`
    uniform float thickness;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vec3 n  = normalize(normalMatrix * normal);
      mv.xyz += n * thickness * (-mv.z) * 0.0022;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform vec3 inkColor;
    void main(){ gl_FragColor = vec4(inkColor,1.0); }`,
  side: THREE.BackSide
});
function inked(geo, color, thickness){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, toon(color)));
  const o = new THREE.Mesh(geo, outlineMat.clone());
  o.material.uniforms.thickness.value = thickness ?? 2.4;
  g.add(o);
  return g;
}

/* ============================================================
   SKY + MOON  (moon is on every stage — brand motif)
   ============================================================ */
const skyMat = new THREE.ShaderMaterial({
  uniforms:{
    top:{value:new THREE.Color(C.dusk)},
    mid:{value:new THREE.Color(C.sun)},
    bot:{value:new THREE.Color(C.sky)},
    blend:{value:0.0}   // 0 = golden hour, 1 = storm
  },
  vertexShader:`varying vec3 vP; void main(){ vP=normalize(position);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    uniform vec3 top,mid,bot; uniform float blend; varying vec3 vP;
    void main(){
      float h = vP.y*0.5+0.5;
      vec3 c = mix(bot, mid, smoothstep(0.35,0.56,h));
      c = mix(c, top, smoothstep(0.56,0.92,h));
      c = mix(c, vec3(0.30,0.32,0.40), blend*0.72);   // storm desaturation
      gl_FragColor = vec4(c,1.0);
    }`,
  side:THREE.BackSide, depthWrite:false
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(420,32,20), skyMat));

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(13,26,20),
  new THREE.MeshBasicMaterial({color:C.moon})
);
moon.position.set(-70, 62, -240);
scene.add(moon);
const halo = new THREE.Mesh(
  new THREE.RingGeometry(15,30,44),
  new THREE.MeshBasicMaterial({color:C.moon, transparent:true, opacity:.13, side:THREE.DoubleSide})
);
halo.position.copy(moon.position); scene.add(halo);

/* lights */
scene.add(new THREE.HemisphereLight(C.sky, C.meadowDark, 0.75));
const key = new THREE.DirectionalLight(0xFFE0B8, 1.15);
key.position.set(-8, 12, 4); scene.add(key);

/* ============================================================
   TRACK
   ============================================================ */
const LANES = [-2.4, 0, 2.4];
const SEG_LEN = 30, SEG_COUNT = 7;
const segments = [];

const groundGeo  = new THREE.BoxGeometry(9, 0.6, SEG_LEN);
const vergeGeo   = new THREE.BoxGeometry(7, 1.1, SEG_LEN);
const pillarGeo  = new THREE.BoxGeometry(1.5, 3.4, 1.5);
const blockGeo   = new THREE.BoxGeometry(2.0, 0.95, 1.3);
const coinGeo    = new THREE.SphereGeometry(0.34, 14, 12);
const treeTopGeo = new THREE.ConeGeometry(2.1, 4.2, 7);
const trunkGeo   = new THREE.CylinderGeometry(0.26, 0.34, 1.6, 6);

const coinMat = new THREE.MeshToonMaterial({color:C.moon, gradientMap:GRAD, emissive:C.moon, emissiveIntensity:.5});

function makeSegment(i){
  const g = new THREE.Group();
  g.position.z = -i * SEG_LEN;

  const path = new THREE.Mesh(groundGeo, toon(C.stone));
  path.position.y = -0.3; g.add(path);

  [-8, 8].forEach(x => {
    const v = new THREE.Mesh(vergeGeo, toon(i%2 ? C.meadow : C.meadowDark));
    v.position.set(x, -0.15, 0); g.add(v);
    const t = inked(treeTopGeo, C.meadowDark, 2.0);
    t.position.set(x + (x<0?-3:3), 2.6, (Math.random()-0.5)*SEG_LEN);
    g.add(t);
    const tr = new THREE.Mesh(trunkGeo, toon(C.boot));
    tr.position.set(t.position.x, 0.6, t.position.z); g.add(tr);
  });

  // pooled hazards + pickups, toggled on recycle
  const obstacles = [], coins = [];
  for(let k=0;k<3;k++){
    const type = k % 2 ? "block" : "pillar";
    const m = inked(type==="pillar"?pillarGeo:blockGeo, type==="pillar"?C.stone:C.meadowDark, 2.6);
    m.userData = {type, jumpable:type==="block"};
    m.visible = false; g.add(m); obstacles.push(m);
  }
  for(let k=0;k<8;k++){
    const c = new THREE.Mesh(coinGeo, coinMat);
    c.visible=false; g.add(c); coins.push(c);
  }
  scene.add(g);
  return {group:g, obstacles, coins};
}
for(let i=0;i<SEG_COUNT;i++) segments.push(makeSegment(i));

function populate(seg, allowHazards){
  seg.obstacles.forEach(o => {
    o.visible = allowHazards && Math.random() < 0.62;
    if(!o.visible) return;
    o.position.set(
      LANES[(Math.random()*3)|0],
      o.userData.type==="pillar" ? 1.5 : 0.42,
      -SEG_LEN/2 + Math.random()*SEG_LEN
    );
    o.rotation.y = (Math.random()-0.5)*0.4;
  });
  // keep at least one lane clear per z-band
  seg.coins.forEach((c,idx) => {
    c.visible = Math.random() < 0.55;
    if(!c.visible) return;
    c.position.set(LANES[(Math.random()*3)|0], 0.9 + (Math.random()<0.25?1.1:0),
                   -SEG_LEN/2 + idx*(SEG_LEN/8));
  });
}
segments.forEach((s,i) => populate(s, i > 2));

/* the hidden letter — one per run, spawns past the storm */
const letterGeo = new THREE.OctahedronGeometry(0.62, 0);
const letter = inked(letterGeo, C.sun, 3.2);
letter.visible = false; scene.add(letter);
let letterQueued = false, letterZ = 0;

/* ============================================================
   PLAYER — green dress, white hat, brown boots
   ============================================================ */
const player = new THREE.Group();
{
  const dress = inked(new THREE.ConeGeometry(0.62, 1.5, 9), C.dress, 2.2);
  dress.position.y = 0.85; player.add(dress);
  const torso = inked(new THREE.CylinderGeometry(0.27,0.33,0.62,8), C.bone, 2.0);
  torso.position.y = 1.72; player.add(torso);
  const head = inked(new THREE.SphereGeometry(0.3,14,12), C.bone, 2.0);
  head.position.y = 2.2; player.add(head);
  const brim = inked(new THREE.CylinderGeometry(0.62,0.62,0.07,16), C.bone, 2.2);
  brim.position.y = 2.42; player.add(brim);
  const crown = inked(new THREE.CylinderGeometry(0.3,0.34,0.36,12), C.bone, 2.2);
  crown.position.y = 2.6; player.add(crown);
  [-0.2,0.2].forEach(x => {
    const b = inked(new THREE.BoxGeometry(0.24,0.4,0.34), C.boot, 2.0);
    b.position.set(x,0.2,0); player.add(b);
  });
}
scene.add(player);

/* ============================================================
   WEATHER — rain, then the rainbow
   ============================================================ */
const RAIN_N = 900;
const rainGeo = new THREE.BufferGeometry();
{
  const p = new Float32Array(RAIN_N*3);
  for(let i=0;i<RAIN_N;i++){
    p[i*3]   = (Math.random()-0.5)*46;
    p[i*3+1] = Math.random()*34;
    p[i*3+2] = -Math.random()*120 + 20;
  }
  rainGeo.setAttribute("position", new THREE.BufferAttribute(p,3));
}
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({
  color:0xCFE6F2, size:0.16, transparent:true, opacity:0
}));
scene.add(rain);

const rainbow = new THREE.Group();
{
  const bands = [0xE86A5C,0xE8955C,0xE8D45C,0x6FC489,0x5C9FE8,0x8A6FD4];
  bands.forEach((col,i) => {
    const r = 46 - i*2.4;
    const m = new THREE.Mesh(
      new THREE.TorusGeometry(r, 1.15, 6, 60, Math.PI),
      new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:0})
    );
    rainbow.add(m);
  });
  rainbow.position.set(4, -6, -150);
  scene.add(rainbow);
}

/* ============================================================
   WILD HORSES — background herd, passes by on a timer
   ============================================================ */
const horses = [];
for(let i=0;i<5;i++){
  const h = new THREE.Group();
  const body = inked(new THREE.BoxGeometry(2.3,1.15,0.95), C.horse, 2.2);
  body.position.y = 1.5; h.add(body);
  const neck = inked(new THREE.BoxGeometry(0.55,1.1,0.6), C.horse, 2.0);
  neck.position.set(1.05,2.15,0); neck.rotation.z = -0.35; h.add(neck);
  for(let k=0;k<4;k++){
    const l = inked(new THREE.BoxGeometry(0.26,1.2,0.26), C.ink, 1.6);
    l.position.set(k<2?0.75:-0.75, 0.6, k%2?0.32:-0.32);
    l.userData.phase = k*1.4; h.add(l);
  }
  h.visible = false; h.userData = {legs:h.children.slice(2)};
  scene.add(h); horses.push(h);
}
let herdTimer = 6;
function releaseHerd(){
  const side = Math.random()<0.5 ? -1 : 1;
  horses.forEach((h,i) => {
    h.visible = true;
    h.position.set(side*(14 + i*2.6), 0, -110 - i*9);
    h.rotation.y = side<0 ? 0.25 : -0.25;
  });
}

/* ============================================================
   STATE
   ============================================================ */
const S = {
  running:false, lane:1, x:0, y:0, vy:0, grounded:true,
  speed:22, dist:0, moons:0, letters:[false,false,false,false],
  storm:0, phase:"clear", t:0
};
const GRAV = -46, JUMP = 15.2;

const $ = id => document.getElementById(id);
const glyphs = [...document.querySelectorAll(".glyph")];

function reset(){
  S.running=true; S.lane=1; S.x=0; S.y=0; S.vy=0; S.grounded=true;
  S.speed=22; S.dist=0; S.moons=0; S.storm=0; S.phase="clear"; S.t=0;
  S.letters=[false,false,false,false];
  glyphs.forEach(g=>g.classList.remove("on"));
  letterQueued=false; letter.visible=false;
  letterZ = 420 + Math.random()*420;
  segments.forEach((s,i)=>{ s.group.position.z = -i*SEG_LEN; populate(s, i>2); });
  rainbow.children.forEach(m=>m.material.opacity=0);
  rain.material.opacity=0; skyMat.uniforms.blend.value=0;
  scene.fog.color.setHex(C.sun);
  $("weather").textContent = "Golden hour";
  $("start").classList.add("hide"); $("over").classList.add("hide");
}
function gameOver(){
  S.running=false;
  $("finalDist").textContent = Math.floor(S.dist);
  $("finalLine").textContent = `metres of island · ${S.moons} moons gathered`;
  const got = S.letters.filter(Boolean).length;
  $("foundLine").textContent = got ? `Letter recovered — ${got}/4 toward the fifth island`
                                   : "No letter this time. It hides after the rain.";
  $("over").classList.remove("hide");
}

/* ============================================================
   INPUT
   ============================================================ */
function move(d){ S.lane = Math.max(0, Math.min(2, S.lane + d)); }
function jump(){ if(S.grounded){ S.vy = JUMP; S.grounded=false; } }

addEventListener("keydown", e => {
  if(!S.running) return;
  if(e.code==="ArrowLeft"||e.code==="KeyA") move(-1);
  if(e.code==="ArrowRight"||e.code==="KeyD") move(1);
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){ e.preventDefault(); jump(); }
});
let tx=0, ty=0;
addEventListener("touchstart", e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
addEventListener("touchend", e => {
  if(!S.running) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) < 34 && Math.abs(dy) < 34){ jump(); return; }
  if(Math.abs(dx) > Math.abs(dy)) move(dx>0?1:-1); else if(dy<0) jump();
}, {passive:true});

$("play").onclick = reset;
$("again").onclick = reset;

/* ============================================================
   LOOP
   ============================================================ */
const clock = new THREE.Clock();
const pBox = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  S.t += dt;

  // ambient motion even on the menu
  halo.lookAt(camera.position);
  halo.rotation.z += dt*0.05;

  if(S.running){
    S.speed = 22 + Math.min(S.dist/90, 16);
    S.dist += S.speed*dt;

    // lane + jump
    S.x += (LANES[S.lane] - S.x) * Math.min(1, dt*13);
    S.vy += GRAV*dt; S.y += S.vy*dt;
    if(S.y <= 0){ S.y = 0; S.vy = 0; S.grounded = true; }
    player.position.set(S.x, S.y, 0);
    player.rotation.z = (LANES[S.lane]-S.x) * 0.22;
    player.position.y += S.grounded ? Math.abs(Math.sin(S.t*13))*0.09 : 0;

    // scroll world
    const dz = S.speed*dt;
    segments.forEach(seg => {
      seg.group.position.z += dz;
      if(seg.group.position.z > SEG_LEN*1.5){
        seg.group.position.z -= SEG_LEN*SEG_COUNT;
        populate(seg, true);
      }
    });

    // ---- weather arc: clear -> rain -> rainbow ----
    if(S.dist > 260 && S.phase==="clear"){ S.phase="rain"; $("weather").textContent="Rain moving in"; }
    if(S.dist > 620 && S.phase==="rain"){ S.phase="bow"; $("weather").textContent="Rainbow ahead"; }
    const target = S.phase==="rain" ? 1 : (S.phase==="bow" ? 0.25 : 0);
    S.storm += (target - S.storm) * dt*0.7;
    skyMat.uniforms.blend.value = S.storm;
    rain.material.opacity = S.phase==="rain" ? S.storm*0.85 : Math.max(0, rain.material.opacity - dt*0.6);
    scene.fog.color.lerpColors(new THREE.Color(C.sun), new THREE.Color(0x6E7C8C), S.storm);
    if(S.phase==="bow"){
      rainbow.children.forEach((m,i)=>{ m.material.opacity = Math.min(0.55, m.material.opacity + dt*0.22); });
      rainbow.rotation.z = Math.sin(S.t*0.2)*0.02;
    }
    if(S.phase==="rain"){
      const pos = rainGeo.attributes.position.array;
      for(let i=0;i<RAIN_N;i++){
        pos[i*3+1] -= (34 + S.speed)*dt;
        if(pos[i*3+1] < 0){ pos[i*3+1] = 30; pos[i*3] = (Math.random()-0.5)*46; }
      }
      rainGeo.attributes.position.needsUpdate = true;
    }

    // ---- the hidden letter ----
    if(!letterQueued && S.dist > letterZ){
      letterQueued = true; letter.visible = true;
      letter.position.set(LANES[(Math.random()*3)|0], 1.1, -95);
    }
    if(letter.visible){
      letter.position.z += dz;
      letter.rotation.y += dt*2.1; letter.rotation.x += dt*0.9;
      letter.position.y = 1.1 + Math.sin(S.t*3)*0.16;
      if(letter.position.z > 12) letter.visible = false;
      if(Math.abs(letter.position.z) < 1.0 &&
         Math.abs(letter.position.x - S.x) < 1.1 && S.y < 2.2){
        letter.visible = false;
        const idx = S.letters.indexOf(false);
        if(idx > -1){ S.letters[idx] = true; glyphs[idx].classList.add("on"); }
      }
    }

    // ---- herd ----
    herdTimer -= dt;
    if(herdTimer <= 0){ releaseHerd(); herdTimer = 16 + Math.random()*12; }
    horses.forEach(h => {
      if(!h.visible) return;
      h.position.z += (S.speed*0.72)*dt + dz*0.35;
      h.userData.legs.forEach(l => { l.rotation.x = Math.sin(S.t*9 + l.userData.phase)*0.6; });
      h.position.y = Math.abs(Math.sin(S.t*9))*0.14;
      if(h.position.z > 25) h.visible = false;
    });

    // ---- collisions ----
    player.getWorldPosition(pBox);
    for(const seg of segments){
      const sz = seg.group.position.z;
      for(const o of seg.obstacles){
        if(!o.visible) continue;
        const wz = sz + o.position.z;
        if(Math.abs(wz) > 1.2) continue;
        if(Math.abs(o.position.x - S.x) > 1.15) continue;
        if(o.userData.jumpable && S.y > 1.05) continue;
        if(!o.userData.jumpable && S.y > 3.6) continue;
        gameOver(); break;
      }
      for(const c of seg.coins){
        if(!c.visible) continue;
        const wz = sz + c.position.z;
        if(Math.abs(wz) > 1.1) continue;
        if(Math.abs(c.position.x - S.x) > 1.0) continue;
        if(Math.abs(c.position.y - (S.y + 1.0)) > 1.5) continue;
        c.visible = false; S.moons++;
      }
    }

    $("dist").textContent = Math.floor(S.dist);
    $("moons").textContent = S.moons;
  }

  // coin spin
  segments.forEach(s => s.coins.forEach(c => { if(c.visible) c.rotation.y += dt*2.4; }));

  // camera drift follows the runner a touch — reads as handheld
  camera.position.x += ((S.x*0.34) - camera.position.x) * Math.min(1, dt*4);
  camera.position.y = 4.4 + Math.sin(S.t*1.6)*0.06;
  camera.lookAt(S.x*0.5, 1.6, -8);

  renderer.render(scene, camera);
}
tick();
})();
</script>

</html>
